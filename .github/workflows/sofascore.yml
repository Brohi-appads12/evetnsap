
name: SofaScore Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sofascore-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      SOFASCORE_STORAGE__DATA_DIR: ${{ github.workspace }}/sofascore-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scraper database
        uses: actions/cache/restore@v4
        with:
          path: sofascore-data
          key: sofascore-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sofascore-data-${{ runner.os }}-

      - name: Install SofaScore Scraper
        run: |
          git clone --depth 1 https://github.com/tunjayoff/sofascore_scraper.git /tmp/sofascore_scraper
          cd /tmp/sofascore_scraper

          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install -e .

          python -m patchright install chromium --no-shell
          python -m patchright install-deps chromium

      - name: Create configuration
        working-directory: /tmp/sofascore_scraper
        run: |
          cat > sofascore.toml <<'EOF'
          [client]
          rate = 1

          [defaults]
          slices = ["core"]

          [[follow]]
          tournament = 17
          name = "Premier League"
          sport = "football"
          seasons = "last:2"

          [[follow]]
          tournament = 7
          name = "Champions League"
          sport = "football"
          seasons = "last:2"

          [[follow]]
          tournament = 8
          name = "La Liga"
          sport = "football"
          seasons = "last:2"

          [[follow]]
          tournament = 23
          name = "Serie A"
          sport = "football"
          seasons = "last:2"
          EOF

      - name: Validate configuration
        working-directory: /tmp/sofascore_scraper
        run: ssc config validate

      - name: Check scraper
        working-directory: /tmp/sofascore_scraper
        run: ssc doctor

      - name: Check SofaScore connectivity
        working-directory: /tmp/sofascore_scraper
        continue-on-error: true
        run: ssc doctor --live --browser

      - name: Sync football data
        id: sync
        working-directory: /tmp/sofascore_scraper
        continue-on-error: true
        run: ssc sync

      - name: Save scraper database
        if: always() && steps.sync.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: sofascore-data
          key: sofascore-data-${{ runner.os }}-${{ github.run_id }}

      - name: Export football events
        id: export
        working-directory: /tmp/sofascore_scraper
        run: |
          mkdir -p "$GITHUB_WORKSPACE/public"

          ssc export \
            --dataset events \
            --format jsonl \
            --out "$GITHUB_WORKSPACE/public/events.jsonl"

          test -s "$GITHUB_WORKSPACE/public/events.jsonl"

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: sofascore-events
          path: public/events.jsonl
          if-no-files-found: error
          retention-days: 7

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/events.jsonl

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update SofaScore football data"
            git push
          fi

      - name: Check final sync result
        if: always()
        run: |
          if [ "${{ steps.sync.outcome }}" != "success" ]; then
            echo "::error::SofaScore sync was incomplete or failed."
            exit 1
          fi

          if [ "${{ steps.export.outcome }}" != "success" ]; then
            echo "::error::Data export failed."
            exit 1
          fi

          echo "SofaScore sync and export completed successfully."
